[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fineract-ingest"
version = "1.0.0"
description = "Apache Fineract REST -> PostgreSQL OLTP ingestion service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Data Engineering" }]
dependencies = [
    "requests>=2.31,<3",
    "psycopg[binary]>=3.1,<4",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "chdb",
    "jinja2",
    "pyyaml",
]

[project.scripts]
fineract-ingest = "fineract_ingest.cli:main"
fineract-mock = "fineract_ingest.mock_server:main"

[tool.setuptools.packages.find]
include = ["fineract_ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live Postgres (skipped unless POSTGRES_HOST is set)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "SIM108"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
