# =====================================================================
# pg_hba.conf
#
# Demo-scoped: scram auth for everything, plus an explicit `replication`
# entry for the Debezium role. Without the replication line the connector
# fails with "no pg_hba.conf entry ... replication connection", which is
# the single most common Debezium-on-Postgres setup error.
# =====================================================================

# TYPE  DATABASE        USER        ADDRESS         METHOD
local   all             all                         trust
host    all             all         127.0.0.1/32    scram-sha-256
host    all             all         ::1/128         scram-sha-256

# Container network
host    all             all         0.0.0.0/0       scram-sha-256

# Logical replication connections (Debezium)
host    replication     debezium    0.0.0.0/0       scram-sha-256
host    replication     postgres    0.0.0.0/0       scram-sha-256
