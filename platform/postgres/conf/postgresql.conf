# =====================================================================
# postgresql.conf - OLTP node tuned for logical replication (CDC).
#
# Mounted at /etc/postgresql/postgresql.conf and activated with
#   command: postgres -c config_file=/etc/postgresql/postgresql.conf
# =====================================================================

listen_addresses = '*'
port = 5432
max_connections = 120

# ---------------------------------------------------------------------
# Logical decoding - the whole point of this file.
# ---------------------------------------------------------------------
wal_level = logical                 # required for Debezium
max_wal_senders = 10                # one per replication connection + headroom
max_replication_slots = 10          # Debezium uses one; keep spares for re-snapshots
wal_sender_timeout = 60s

# Retain enough WAL that a connector restart within ~15 min never loses
# its position. Too small and a slow consumer forces a full re-snapshot;
# too large and disk fills. 1 GB is a sane single-node compromise.
max_slot_wal_keep_size = 1GB
wal_keep_size = 512MB

# ---------------------------------------------------------------------
# Memory / checkpoints (small-footprint defaults for a laptop-sized demo;
# see docs/SCALING.md for production sizing)
# ---------------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 128MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 128MB

# ---------------------------------------------------------------------
# Observability - these views back the postgres_exporter dashboards.
# ---------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = all
track_io_timing = on
track_activities = on
track_counts = on

# ---------------------------------------------------------------------
# Logging: slow queries and lock waits are the two things that actually
# explain a stalled pipeline.
# ---------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000   # ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
datestyle = 'iso, mdy'
